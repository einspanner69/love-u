<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>А ты меня любишь?</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #3a2e33;
    font-family: 'Georgia', 'Times New Roman', serif;
    color: #e8d5da;
    padding: 20px;
    overflow: hidden;
  }

  .container {
    position: relative;
    max-width: 680px;
    width: 100%;
    background: #4a3a40;
    border-radius: 16px;
    padding: 48px 36px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    border: 1px solid #5e4a51;
    transition: padding 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-height: 90vh; 
  }

  .container.text-mode {
    padding: 36px;
  }

  h1 {
    font-size: 2rem;
    font-weight: normal;
    text-align: center;
    margin-bottom: 36px;
    color: #f2e2e7;
    letter-spacing: 0.5px;
    transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    max-height: 100px;
    opacity: 1;
    overflow: hidden;
  }

  h1.hidden {
    opacity: 0;
    max-height: 0;
    margin-bottom: 0;
    pointer-events: none;
  }

  .buttons {
    display: flex;
    gap: 20px;
    justify-content: center;
    align-items: center;
    min-height: 60px;
    margin-bottom: 0;
    opacity: 1;
    transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .buttons.hidden {
    opacity: 0;
    min-height: 0;
    height: 0;
    margin-bottom: 0;
    padding: 0;
    pointer-events: none;
    overflow: hidden;
  }

  button {
    font-family: inherit;
    font-size: 1.15rem;
    padding: 14px 44px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.25s ease, box-shadow 0.25s ease, transform 0.15s ease;
    letter-spacing: 0.5px;
  }

  #btn-yes {
    background: #a86b7e;
    color: #fdf0f3;
  }

  #btn-yes:hover {
    background: #bd7f92;
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(168, 107, 126, 0.4);
  }

  #btn-no {
    background: #7d5a66;
    color: #fdf0f3;
    position: relative;
    z-index: 10;
  }

  #btn-no:hover {
    background: #946c7a;
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(125, 90, 102, 0.4);
  }

  #btn-no.running {
    transition: left 0.25s ease, top 0.25s ease, background 0.25s ease;
  }

  #btn-no.running:hover {
    transform: none;
    box-shadow: none;
  }

  .message {
    margin-top: 0;
    font-size: 1.05rem;
    line-height: 1.75;
    color: #dcc7ce;
    text-align: center;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.8s cubic-bezier(0.4, 0, 0.2, 1), 
                opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1),
                margin-top 0.6s ease;
  }

  .message.show {
    margin-top: 0;
    max-height: 1200px;
    opacity: 1;
  }

  .message .short {
    display: block;
    font-size: 1.4rem;
    color: #f2e2e7;
    margin-bottom: 24px;
  }

  .message .long {
    display: block;
    text-align: center;
    font-size: 0.98rem;
    color: #cbb4bc;
    max-height: 60vh;
    overflow-y: auto;
    padding-right: 10px;
  }

  .message .long::-webkit-scrollbar {
    width: 6px;
  }
  .message .long::-webkit-scrollbar-track {
    background: #3a2e33;
    border-radius: 3px;
  }
  .message .long::-webkit-scrollbar-thumb {
    background: #7d5a66;
    border-radius: 3px;
  }
  .message .long::-webkit-scrollbar-thumb:hover {
    background: #a86b7e;
  }

  .message .long p {
    margin-bottom: 16px;
  }
  .message .long p:last-child {
    margin-bottom: 0;
  }
</style>
</head>
<body>

<div class="container" id="container">
  <h1 id="question">А ты меня любишь?</h1>

  <div class="buttons" id="buttons">
    <button id="btn-yes">Да</button>
    <button id="btn-no">Нет</button>
  </div>

  <div class="message" id="message">
    <span class="short" id="short-text"></span>
    <span class="long" id="long-text"></span>
  </div>
</div>

<script>
  // Текст для кнопки "Да" (теперь здесь приглашение на свидание)
  const textYes = `
    <p>Мыслей в голове так много, что они переполняют меня, но в то же время я понимаю, что никакие слова не смогут в полной мере описать то, что я чувствую к тебе. Иногда мне кажется, что я недостаточно часто говорю об этом, недостаточно показываю, но поверь, внутри меня целый океан чувств, и каждый день я благодарен судьбе за то, что ты есть.</p>
    
    <p>Оглядываясь назад, я поражаюсь, как сильно изменилась моя жизнь. Кажется, что мы знакомы целую вечность, и в то же время я до сих пор ловлю себя на мысли, как мне повезло. Ты стала для меня не просто человеком, с которым я делю дни, ты стала моим спокойствием, тем самым родным уголком, домом, куда всегда хочется возвращаться, что бы ни происходило вокруг. Ты видишь меня разным — уставшим, задумчивым, иногда капризным, веселым или взволнованным, и принимаешь меня любым, даже если недовольничаешь. Я очень благодарен тебе за это.</p>
    
    <p>Я люблю в тебе абсолютно все. То, как ты улыбаешься, как серьезно говоришь о важных вещах, как можешь поднять мне настроение одной фразой и своим простым присутствием. Я люблю даже твои мелкие привычки, которые давно стали для меня чем-то бесконечно родным. Рядом с тобой я перестал бояться будущего, начал его видеть и желать, потому что теперь я представляю его только с тобой. Мне нравится смотреть, как ты растешь, как стремишься к своим целям, и я хочу поддерживать тебя на этом пути во всем.</p>
    
    <p>Спасибо тебе за каждую минуту, проведенную рядом. За твое терпение, за внимание к моим, казалось бы, незначительным мелочам, за то, что ты понимаешь меня даже тогда, когда я не могу толком объяснить свои чувства. Как стараешься открываться раз за разом и доверять мне, хоть я и часто не оправдываю ожиданий. Ты даешь мне то самое ощущение безопасности и тепла, в котором хочется остаться навсегда, научила меня верить, что любовь — это не просто громкие слова, а ежедневная забота, уважение и желание быть рядом вопреки всему.</p>
    
    <p>Я часто прокручиваю в голове наши случайные шутки, долгие разговоры И я понимаю, что именно из этих мелочей и соткано мое счастье. Я мечтаю о простых вещах: гулять с тобой за руку, строить планы, дурачиться, спорить о ерунде и мириться, проживать рядом весь остаток вечности. Хочу быть тем, к кому ты всегда возвращаешься. Тем, с кем ты можешь быть абсолютно собой. Тем, кто будет верить в тебя даже тогда, когда ты сама в себе сомневаешься. Я не идеален, и знаю, что бывают моменты, когда я ошибаюсь или говорю что-то не так. Но пожалуйста, никогда не сомневайся в искренности моих чувств. Каждое мое «я тебя люблю» идет из самых глубин моего сердца. Твое счастье, твои чувства и твое душевное спокойствие важны для меня превыше всего.</p>
    
    <p>Совсем скоро, 28 октября, наступит особенный день. День, когда ровно полтора года назад мы с тобой встретились и открыли друг друга. Время летит невероятно быстро, месяцы сменяют друг друга, жизнь вокруг меняется, но мои чувства к тебе остаются неизменными. Ты по-прежнему нужна мне, и я каждый раз снова и снова выбираю тебя. Ты — мое самое большое счастье и самый большой подарок, моя мечта.</p>
    
    <p>Я хочу провести этот день только с тобой. Ты была бы не против ночью 28 числа сходить на свидание? Я бы очень хотел отпраздновать этот наш маленький, но такой огромный юбилей, вместе с тобою. Это не первый раз и не последний, но по-прежнему мне важный день.</p>
  `;

  // Текст для кнопки "Нет" (теперь здесь про хрупкость случайности и Вселенную)
  const textNo = `
    <p>Я иногда думаю о том, как хрупка и удивительна случайность. Из миллиардов людей, из тысяч дорог, из миллионов ежесекундных решений мы с тобой оказались в одной точке пространства и времени. В момент, когда наши взгляды пересеклись, Вселенная не взорвалась и не остановилась, но для меня в тот день что-то фундаментально изменилось. Я не сразу это понял, но сейчас, оглядываясь назад, я вижу, как четко сработал этот невидимый механизм. Это не просто стечение обстоятельств. Это то, что я называю чудом. Моим самым лучшим чудом.</p>
    
    <p>Ты знаешь, в людях обычно ищут сходства. Ищут того, кто поймет, кто согласится, кто будет думать так же. А меня с первой секунды нашего общения поразило другое. Ты — это отдельная, невероятно богатая Вселенная, у тебя свой взгляд на вещи, свои странные привычки, свой уникальный способ реагировать на мир. И самое красивое в тебе — это твоя искренность, твоя безграничная любовь.</p>
    
    <p>Меня не перестает восхищать то, как ты проживаешь свою жизнь. В тебе столько внутренней силы, даже когда ты сама этого не замечаешь. Мне нравится наблюдать за твоими мыслями, за тем, как ты загораешься какой-то идеей, как ищешь ответы на сложные вопросы, либо задаешь мне всякие глупости, чтобы побыть рядом. Я смотрю на тебя, и во мне просыпается какое-то невероятное, дикое желание защищать тебя, хоть это для тебя наверняка не видно и не ясно. Быть тем человеком, рядом с которым ты можешь позволить себе быть слабой, не боясь осуждения. Я за тобой, рядом с тобою всегда. В любом твоем безумстве и в любых сомнениях.</p>
    
    <p>Я поймал себя на том, что начал смотреть на мир более заинтересованно, стал искать то, что могло бы тебе понравиться или то, что я в целом не видел в своей апатии раньше. Замечать краски заката, слушать звуки улиц, находить прелесть в самых обычных вещах. Ты словно включила в моей голове какой-то другой свет, более яркий и красочный. Я стал замечать больше, потому что мне хочется показать это тебе. Мне хочется приносить тебе этот мир на ладони, хочется, чтобы ты никогда не сомневалась в том, насколько ты важна.</p>
    
    <p>Иногда мне кажется, что я могу сказать «я тебя люблю» тысячу раз, но этого все равно будет мало. Любовь к тебе — это не просто чувство, это состояние, в котором я существую. Это то, что происходит со мной каждую секунду, пока я есть, то, что заставляет мое сердце биться сильнее, когда я вижу или просто думаю о тебе, а особенно когда слышу тебя в очередной раз. Я не знаю, что будет завтра, не знаю, какие дороги нам предстоят. Но я точно понимаю: куда бы ни повернула жизнь, где бы мы ни оказались, я буду держать тебя за руку.</p>
    
    <p>Я выбираю тебя. Я выбираю тебя за то, что рядом с тобой я чувствую себя по-настоящему живым. Я люблю тебя глубоко, осознанно, до самых краев. И если бы вселенная снова дала мне шанс выбрать себе человека, я бы каждый раз находил тебя безошибочно. Спасибо тебе за то, что ты просто есть.</p>
  `;

  const btnYes = document.getElementById('btn-yes');
  const btnNo = document.getElementById('btn-no');
  const buttons = document.getElementById('buttons');
  const message = document.getElementById('message');
  const question = document.getElementById('question');
  const container = document.getElementById('container');
  const shortText = document.getElementById('short-text');
  const longText = document.getElementById('long-text');

  const MAX_DODGES = 5;
  let dodgeCount = 0;
  let surrendered = false;

  function dodge() {
    const rect = btnNo.getBoundingClientRect();
    const pad = 20;
    const maxX = window.innerWidth - rect.width - pad;
    const maxY = window.innerHeight - rect.height - pad;

    const newX = Math.max(pad, Math.random() * maxX);
    const newY = Math.max(pad, Math.random() * maxY);

    btnNo.classList.add('running');
    btnNo.style.position = 'fixed';
    btnNo.style.left = newX + 'px';
    btnNo.style.top = newY + 'px';
  }

  function showLove(shortMessage, longMessage) {
    buttons.classList.add('hidden');
    question.classList.add('hidden');
    container.classList.add('text-mode');

    shortText.textContent = shortMessage;
    longText.innerHTML = longMessage;
    
    setTimeout(() => {
      message.classList.add('show');
    }, 150);
  }

  btnYes.addEventListener('click', function () {
    // При нажатии на "Да" выводим "И я тебя люблю!" и текст с приглашением
    showLove('И я тебя люблю!', textYes);
  });

  btnNo.addEventListener('click', function () {
    if (surrendered) return;

    if (dodgeCount < MAX_DODGES) {
      dodgeCount++;
      dodge();
    } else {
      surrendered = true;
      btnNo.textContent = 'А я тебя люблю';
      btnNo.style.background = '#a86b7e';
      btnNo.style.fontSize = '1rem';
      // При клике на "Нет" выводим "А я тебя люблю." и текст про Вселенную
      showLove('А я тебя люблю.', textNo);
    }
  });
</script>

</body>
</html>
